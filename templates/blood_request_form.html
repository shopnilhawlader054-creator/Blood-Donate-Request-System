{% extends "base.html" %}

{% block title %}Create Blood Request - Blood Donate & Request System{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto">

    <!-- Header Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 text-red-600 rounded-full mb-4 shadow-inner">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Create Emergency Blood Request</h1>
      <p class="mt-2 text-sm text-gray-600">Fill in the details below so potential donors can respond quickly.</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white shadow-xl rounded-2xl border border-gray-100 p-6 sm:p-10">
      <form method="POST" action="" class="space-y-6">
        {% csrf_token %}

        <!-- Patient Name & Required Blood Group -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label for="patient_name" class="block text-sm font-semibold text-gray-700 mb-1">
              Patient Name <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              name="patient_name" 
              id="patient_name" 
              required 
              placeholder="e.g. Rahim Ahmed"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none"
            >
          </div>

          <div>
            <label for="blood_group" class="block text-sm font-semibold text-gray-700 mb-1">
              Required Blood Group <span class="text-red-500">*</span>
            </label>
            <select 
              name="blood_group" 
              id="blood_group" 
              required 
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none bg-white"
            >
              <option value="" disabled selected>Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <!-- Hospital Name & Hospital Location -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label for="hospital_name" class="block text-sm font-semibold text-gray-700 mb-1">
              Hospital Name <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              name="hospital_name" 
              id="hospital_name" 
              required 
              placeholder="e.g. Feni Sadar Hospital"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none"
            >
          </div>

          <div>
            <label for="location" class="block text-sm font-semibold text-gray-700 mb-1">
              Hospital Location / City <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              name="location" 
              id="location" 
              required 
              placeholder="e.g. Feni"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none"
            >
          </div>
        </div>

        <!-- Required Date & Number of Bags -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label for="required_date" class="block text-sm font-semibold text-gray-700 mb-1">
              Required Date <span class="text-red-500">*</span>
            </label>
            <input 
              type="date" 
              name="required_date" 
              id="required_date" 
              required 
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none"
            >
          </div>

          <div>
            <label for="bags_required" class="block text-sm font-semibold text-gray-700 mb-1">
              Number of Bags Required <span class="text-red-500">*</span>
            </label>
            <input 
              type="number" 
              name="bags_required" 
              id="bags_required" 
              min="1" 
              value="1" 
              required 
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none"
            >
          </div>
        </div>

        <!-- Contact Number -->
        <div>
          <label for="contact_number" class="block text-sm font-semibold text-gray-700 mb-1">
            Contact Number <span class="text-red-500">*</span>
          </label>
          <input 
            type="tel" 
            name="contact_number" 
            id="contact_number" 
            required 
            placeholder="e.g. 01812345678"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none"
          >
        </div>

        <!-- Reason / Description -->
        <div>
          <label for="description" class="block text-sm font-semibold text-gray-700 mb-1">
            Reason / Extra Description (Optional)
          </label>
          <textarea 
            name="description" 
            id="description" 
            rows="4" 
            placeholder="Describe the medical situation, specific ward, or urgency..."
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-sm text-gray-900 outline-none resize-none"
          ></textarea>
        </div>

        <!-- Submit & Cancel Buttons -->
        <div class="pt-4 flex flex-col sm:flex-row items-center gap-3">
          <button 
            type="submit" 
            class="w-full sm:w-auto flex-1 inline-flex justify-center items-center px-6 py-3 border border-transparent rounded-xl shadow-md text-base font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition"
          >
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
            Post Blood Request
          </button>

          <a 
            href="#" 
            class="w-full sm:w-auto inline-flex justify-center items-center px-6 py-3 border border-gray-300 rounded-xl text-base font-medium text-gray-700 bg-white hover:bg-gray-50 transition"
          >
            Cancel
          </a>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
