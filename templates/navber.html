<nav class="bg-white border-b border-red-100 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            
            <!-- বাম পাশে: লোগো বা ব্র্যান্ড নেম -->
            <div class="flex items-center">
                <a href="{% url 'home' %}" class="flex items-center gap-2 text-xl font-extrabold text-red-600 tracking-tight">
                    <span class="bg-red-100 text-red-600 p-1.5 rounded-lg text-lg">🩸</span>
                    <span>BloodDonate <span class="text-gray-800">BD</span></span>
                </a>
            </div>

            <!-- মাঝখানে: আপডেট করা মেনু আইটেমসমূহ (View Donor Profile সহ) -->
            <div class="hidden md:flex items-center space-x-1 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                <a href="{% url 'home' %}" class="text-gray-700 hover:text-red-600 hover:bg-white px-3.5 py-1.5 rounded-full text-sm font-medium transition">
                    Home
                </a>
                {% if request.user.donar.exists %}
                     <a href="{% url "view_donor_profile" %}" class="text-gray-700 hover:text-red-600 hover:bg-white px-3.5 py-1.5 rounded-full text-sm font-medium transition">
                    View Donor Profile
                  </a>
                {% else %}
                      <a href="{% url "creat_donor" %}" class="text-gray-700 hover:text-red-600 hover:bg-white px-3.5 py-1.5 rounded-full text-sm font-medium transition">
                    Create Donor Account
                   </a>
                {% endif %}
                <a href="#" class="text-gray-700 hover:text-red-600 hover:bg-white px-3.5 py-1.5 rounded-full text-sm font-medium transition">
                    My Donor Request
                </a>
            </div>

            <!-- ডান পাশে: ইউজার প্রোফাইল ব্যাজ ও লগআউট -->
            <div class="flex items-center space-x-3">
                <!-- ইউজারের নাম (পিল ব্যাজ ডিজাইন) -->
                <div class="hidden sm:flex items-center gap-2 bg-red-50 text-red-700 px-3 py-1.5 rounded-full text-sm font-semibold border border-red-100">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <span>{{ request.user.username }}</span>
                </div>

                <!-- লগআউট ফর্ম -->
                <form action="#" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-700 shadow-sm hover:shadow transition cursor-pointer">
                        Logout
                    </button>
                </form>
            </div>

        </div>
    </div>
</nav>
